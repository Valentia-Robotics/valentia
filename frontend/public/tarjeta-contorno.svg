<?xml version="1.0" encoding="UTF-8"?>
<!-- Valentia · CONTORNO DE LA TARJETA para cortar con láser.
     Tamaño real: 85,6 × 54 mm (tarjeta de crédito), esquinas redondeadas de 3 mm.
     Solo una línea roja fina (sin relleno) = CORTAR. Mide lo mismo que los SVG de grabado de las
     tarjetas, así que si lo colocas en la misma posición, el corte coincide con el dibujo. -->
<svg xmlns="http://www.w3.org/2000/svg" width="85.6mm" height="54mm" viewBox="0 0 85.6 54">
  <rect id="cortar" x="0.05" y="0.05" width="85.5" height="53.9" rx="3" ry="3" fill="none" stroke="#FF0000" stroke-width="0.1"/>
</svg>
